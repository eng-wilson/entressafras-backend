[project]
name = "entressafras-backend"
version = "0.1.0"
description = "Entressafras backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "earthengine-api>=1.7.52",
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
